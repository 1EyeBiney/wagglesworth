# Builds Wagglesworth Estate and publishes it to GitHub Pages on every push
# to main. This is the whole point of the repo-as-source-of-truth model:
# nobody, including Barb on her own computer, ever needs Node installed to
# publish a change — pushing (or saving through the GitHub web editor) is
# the entire deploy step. See MAINTENANCE.md.
name: Build and deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            # The same two commands CLAUDE.md requires before any commit,
            # run here so a mistake made through the GitHub web editor fails
            # loudly instead of quietly publishing something broken.
            - run: npm run build
            - run: npm run check

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
