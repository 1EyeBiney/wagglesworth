<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="qv-title qv-desc">
    <title id="qv-title">A Valentine's still life with chips and queso</title>
    <desc id="qv-desc">A decorative Valentine's Day still life: a bowl of queso, a scattering of tortilla chips, and small hearts, in the Estate's royal purple, soft pink, silver, and cream palette. No characters are shown, since original artwork for this story was never located.</desc>
    <rect width="800" height="600" fill="#FFF8E8"/>

    <!-- Table -->
    <rect x="0" y="440" width="800" height="160" fill="#E8B7CF" opacity="0.4"/>

    <!-- Bowl of queso -->
    <ellipse cx="400" cy="440" rx="150" ry="40" fill="#5B2C83"/>
    <ellipse cx="400" cy="420" rx="130" ry="34" fill="#E8B7CF"/>
    <ellipse cx="400" cy="415" rx="105" ry="26" fill="#FFF8E8"/>

    <!-- Chips -->
    <g fill="#A7A9AC">
        <path d="M220 460 l40 -70 l40 70 z"/>
        <path d="M280 470 l40 -75 l40 75 z"/>
        <path d="M540 465 l40 -72 l40 72 z"/>
        <path d="M600 475 l38 -68 l38 68 z"/>
    </g>

    <!-- Hearts scattered above -->
    <g fill="#5B2C83">
        <path d="M300 180 c0 -22 -34 -22 -34 0 c0 22 34 40 34 56 c0 -16 34 -34 34 -56 c0 -22 -34 -22 -34 0 z"/>
    </g>
    <g fill="#E8B7CF">
        <path d="M480 150 c0 -18 -28 -18 -28 0 c0 18 28 32 28 46 c0 -14 28 -28 28 -46 c0 -18 -28 -18 -28 0 z"/>
        <path d="M560 220 c0 -14 -22 -14 -22 0 c0 14 22 26 22 36 c0 -10 22 -22 22 -36 c0 -14 -22 -14 -22 0 z"/>
        <path d="M230 240 c0 -14 -22 -14 -22 0 c0 14 22 26 22 36 c0 -10 22 -22 22 -36 c0 -14 -22 -14 -22 0 z"/>
    </g>

    <!-- Silver Rose motif -->
    <g transform="translate(60,60) scale(0.6)" fill="#A7A9AC" opacity="0.9">
        <circle cx="32" cy="32" r="6"/>
        <path d="M32 26 C24 20, 18 22, 16 30 C18 24, 26 22, 32 26 Z"/>
        <path d="M38 26 C46 20, 52 22, 54 30 C52 24, 44 22, 38 26 Z"/>
        <path d="M26 32 C20 24, 22 18, 30 16 C24 18, 22 26, 26 32 Z"/>
        <path d="M26 38 C20 46, 22 52, 30 54 C24 52, 22 44, 26 38 Z"/>
        <path d="M38 38 C46 46, 52 52, 54 54 C52 48, 44 42, 38 38 Z"/>
    </g>
</svg>
